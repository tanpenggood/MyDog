# MyDog installer pipeline (M5).
#
# Each job runs on a native runner because jpackage cannot cross-build: the
# Windows job produces the .msi, the Linux job the .deb, the macOS job the .dmg.
# The openjfx dependency in pom.xml carries no OS classifier on purpose — its
# POM activates the platform profile of the *build* machine, so every installer
# embeds exactly its own platform's JavaFX jars.
#
# JDK: Eclipse Temurin 25 (LTS). Verified available for GA on 2026-11-17 via
# https://api.adoptium.net/v3/info/available_releases (25 is in both
# available_releases and available_lts_releases; windows/linux x64 and mac
# x64/aarch64 binaries all resolve at /v3/assets/latest/25/hotspot).
#
# Tests: packaging jobs run `verify -DskipTests -DskipITs` — surefire and
# failsafe both stay off; the suite belongs to test.yml, which brings up the
# MySQL sandboxes and a virtual display so the integration tests (including
# the wizard's click-through) really run. NOTE: -DskipTests alone does NOT
# stop failsafe (learned the hard way: the Linux job once ran SyncWizardModelIT
# on a bare runner and hung for 6h until the job timeout killed it).
#
# macOS note: macos-latest runners are Apple Silicon and GitHub's Intel
# (x64) runners were fully retired (macos-13, Dec 2025), so BOTH mac dmg
# variants are built on arm64 runners: the arm64 one with the default aarch64
# JDK, the x64 (Intel) one with an x64 JDK run transparently under Rosetta 2
# (preinstalled on GitHub's arm64 mac images). jpackage cannot cross-compile,
# but it faithfully packages whichever JDK runs it — so the x64 job bundles
# an x64 runtime, and the openjfx POM resolves the `mac` (x64) classifier
# jars because Maven's JVM reports os.arch=x86_64 under Rosetta. The x64 dmg
# runs natively on Intel Macs and via Rosetta on Apple Silicon. Both are
# unsigned — see README for the right-click → Open first launch. A single
# universal2 dmg is a v2 item.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: native-win
            artifact: MyDog-windows-x64
            ext: msi
          - os: ubuntu-latest
            profile: native-linux
            artifact: MyDog-linux-x64
            ext: deb
          - os: macos-latest
            profile: native-mac
            artifact: MyDog-macos-arm64
            ext: dmg
          - os: macos-latest       # Apple Silicon runner, x64 build via Rosetta 2
            profile: native-mac
            artifact: MyDog-macos-x64
            ext: dmg
            jdk-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # empty for all but the Rosetta mac job — setup-java falls back to
          # the runner's own arch when the input is empty
          architecture: ${{ matrix.jdk-arch }}
          cache: maven

      # jpackage shells out to the WiX 3.x toolset to build an .msi. The choco
      # package that carries it is "wixtoolset" (NOT wixtoolset-sdk, which is
      # the WiX 4 SDK and not what jpackage wants); newer runner images also
      # preinstall it, so install is skipped when candle.exe is already on PATH.
      - name: Install WiX toolset (Windows .msi only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            choco install wixtoolset -y
            $bin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin' | Select-Object -First 1).FullName
            echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "WIX=$bin\..\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build installer (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -P ${{ matrix.profile }} verify -DskipTests -DskipITs

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B -ntp -P ${{ matrix.profile }} verify -DskipTests -DskipITs

      # jpackage names the installer "<name>-<app-version>.<ext>" and the
      # version cannot be dropped (jpackage requires --app-version, and the
      # Windows/Linux package metadata needs it). The app that lands on the
      # user's machine is still "MyDog"; this rename only changes the
      # download filename on the Release page to "MyDog-<os>-<arch>.<ext>",
      # so it stays true when a version no longer matches its tag.
      - name: Rename installer (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p target/dist-renamed
          mv target/dist/*.${{ matrix.ext }} "target/dist-renamed/${{ matrix.artifact }}.${{ matrix.ext }}"

      - name: Rename installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force target/dist-renamed | Out-Null
          Move-Item (Get-Item "target/dist/*.${{ matrix.ext }}") "target/dist-renamed/${{ matrix.artifact }}.${{ matrix.ext }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/dist-renamed/*
          if-no-files-found: error

  # Attach the three installers to the GitHub Release of the pushed tag.
  # softprops/action-gh-release resolves the Release by tag name and appends
  # files to it, so it works both for releases created by pushing a git tag
  # and for ones drafted on the web page — as long as the tag names match.
  # It authenticates with the default GITHUB_TOKEN, which is fine for
  # same-repo releases once this job has contents: write.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
