# Deliberately EMPTY, apart from this comment. Do not move translations in here.
#
# ResourceBundle builds its candidate list from the requested locale and then, before falling back
# to the base bundle, inserts the *system default* locale. So on a machine whose OS language is
# Chinese, getBundle("Messages", Locale.ENGLISH) skipped Messages.properties and returned
# Messages_zh_CN.properties: picking English in the menu did nothing at all.
#
# This file satisfies the "en" candidate directly. It holds no keys, so every lookup continues to
# resolve through its parent — Messages.properties, the single source of the English text.
#
# I18nBundleTest fails if the OS-locale leak ever comes back, so this trick cannot be deleted
# silently.
