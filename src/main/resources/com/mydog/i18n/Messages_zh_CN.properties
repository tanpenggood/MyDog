sync.dropExtraneous=删除仅存在于目标库的对象
sync.dropExtraneous.help=不勾选时多余对象保持不动；勾选后，源库没有的表/视图/例程会在目标库被删除。
sync.chunkSize=每批行数
sync.chunkSize.help=一次读取、比较并提交多少行。越大越快，两侧占用的内存也越多。
sync.fast=快速数据模式
sync.fast.help=跳过逐行比较，用 INSERT ... ON DUPLICATE KEY UPDATE 写入源库全部行；目标库多出来的行不会被删除。
sync.endpoints.hint=源库只读；所有写操作只发生在目标库，每批一个事务。
sync.step.connections=选择两端数据库
sync.step.scope=选择要比较的对象
