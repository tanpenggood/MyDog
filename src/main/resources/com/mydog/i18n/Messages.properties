sync.dropExtraneous=Drop objects that exist only on the target
sync.dropExtraneous.help=Unchecked, extra objects are left alone. Ticked, tables/views/routines the source does not have are dropped from the target.
sync.chunkSize=Rows per batch
sync.chunkSize.help=How many rows are read, compared and committed in one pass. Larger is faster and uses more memory on both sides.
sync.fast=Fast data mode
sync.fast.help=Skip the row-by-row comparison: write every source row with INSERT ... ON DUPLICATE KEY UPDATE. Rows the target has extra are not deleted.
sync.endpoints.hint=The source is only ever read. Every write goes to the target, one transaction per batch.
